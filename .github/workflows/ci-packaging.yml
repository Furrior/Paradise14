name: Test Packaging

# Packages the server and client and uploads logs.
# Logs are retained for seven days.
# This only happens on merge to main branches to try and minimize compute time.

on:
  push:
    branches: [master]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.git**'
      - 'RobustToolbox'
      - 'RobustToolbox/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Install dependencies
        run: dotnet restore --locked-mode

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package server
        run: dotnet run --project Content.Packaging server --log-build --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

      - name: Package client
        run: dotnet run --project Content.Packaging client --log-build --no-wipe-release

      - uses: actions/upload-artifact@v4
        with:
          name: binlogs
          path: release/*.binlog
          retention-days: 7
